# Linux.do 帖子解析配置

# 是否启用群聊链接解析
# 自动检测群聊中的 linux.do/t/topic/xxx 链接并解析
linkParseStatus: true

# 是否在截图底部显示 logo
showLogo: true

# 自动刷新 Cookie 配置
autoCookie:
  enable: true                   # 是否启用自动刷新 Cookie
  refreshInterval: 0             # Cookie 刷新间隔（分钟，默认20分钟）为0时禁用定时刷新
  browserPath: "C:/Program Files (x86)/Microsoft/Edge/Application/msedge.exe"                 # 浏览器路径，例如: C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe
  debuggingPort: 9222             # 调试端口

# User-Agent
# 获取方式: 浏览器访问 linux.do -> F12 -> Network -> 复制请求头中的 User-Agent
userAgent: ""

# Linux.do Cookie
# 获取方式: 浏览器登录 linux.do -> F12 -> Network -> 复制请求头中的 Cookie
# 格式: 在 cookie: 后面加 >- 然后换行，直接粘贴 cookie 内容（无需引号）
cookie: >-


# 代理配置 (Clash 默认端口 7890)
proxy:
  enable: true
  host: "127.0.0.1"
  port: 7890
